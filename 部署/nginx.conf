# ============================================================
#  渺の怪动静 / 渺の歌单  —— nginx 站点配置
#  用法（Ubuntu / Debian）：
#     sudo cp nginx.conf /etc/nginx/sites-available/yuki
#     sudo ln -s /etc/nginx/sites-available/yuki /etc/nginx/sites-enabled/yuki
#     sudo nginx -t && sudo systemctl reload nginx
#  CentOS / RHEL / Rocky：
#     sudo cp nginx.conf /etc/nginx/conf.d/yuki.conf
#     sudo nginx -t && sudo systemctl reload nginx
#  （注意：conf.d 里的文件由主配置 include，不要重复写 http{} 外层）
# ============================================================

server {
    # 本内网服务器使用的服务端口（如需改成 80 就直接改这两行）
    listen 25565;
    listen [::]:25565;

    # 内网没有域名就保持 _ ；有域名就填域名，例如 site.example.com
    server_name _;

    # ★★ 改成你上传 dist 内容的位置 ★★
    root /var/www/yuki-voice-button;
    index index.html;

    # 中文文件名 / 中文 URL 正常处理
    charset utf-8;

    # 页面路由：/about 和 /about/ 都能访问；找不到返回 404
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 不缓存，改完刷新即可看到最新内容
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 带哈希的构建产物可以长期缓存（文件名变了就是新文件）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 音频（/audio/…）：nginx 静态文件默认已支持 Range，可拖动进度条，
    # 因此这里不需要额外配置，走上面的默认 location 即可。

    # 图标字体：Ubuntu 自带的 nginx 没映射 .ttf，不补的话会返回 application/octet-stream
    location ~* \.(ttf|otf|woff|woff2|eot)$ {
        types {
            font/ttf   ttf;
            font/otf   otf;
            font/woff  woff;
            font/woff2 woff2;
        }
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 图标 / 缩略图
    location ~* ^/(icons|thumbs|fonts)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 压缩（JS / CSS / SVG / JSON）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # 不暴露隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/yuki.access.log;
    error_log  /var/log/nginx/yuki.error.log;
}
